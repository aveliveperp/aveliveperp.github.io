<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="favicon.ico" />
  <title>Ave.ai 社区直播间</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #0c1a2d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 18% 8%, rgba(53, 124, 255, 0.28), transparent 30%),
        radial-gradient(circle at 82% 22%, rgba(255, 178, 51, 0.18), transparent 28%),
        linear-gradient(160deg, #102b56 0%, #0c1728 56%, #142034 100%);
    }

    .h5-page {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 14px max(22px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      text-decoration: none;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      filter: drop-shadow(0 8px 18px rgba(59, 140, 255, 0.28));
    }

    .brand-name {
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .social-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      overflow: hidden;
      color: #fff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      backdrop-filter: blur(10px);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .social-link:hover,
    .social-link:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.46);
      outline: none;
    }

    .social-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .header {
      margin: 0 0 16px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 2px 0 rgba(255, 190, 62, 0.9), 0 10px 26px rgba(0, 0, 0, 0.35);
    }

    .header p {
      margin: 0;
      color: rgba(255, 255, 255, 0.84);
      font-size: 15px;
      line-height: 1.5;
    }

    .live-list {
      display: grid;
      gap: 16px;
    }

    .live-card {
      display: block;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.34);
      -webkit-tap-highlight-color: transparent;
      animation: cardIn 0.62s ease both, cardFloat 4.2s ease-in-out infinite;
    }

    .live-card:nth-child(2) {
      animation-delay: 0.12s, 0.42s;
    }

    .live-card:nth-child(3) {
      animation-delay: 0.24s, 0.84s;
    }

    .poster {
      display: block;
      width: 100%;
      aspect-ratio: 2.2 / 1;
      overflow: hidden;
      background: #05070d;
    }

    .poster img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .action {
      display: block;
      padding: 0;
      background: transparent;
    }

    .button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 10px 16px;
      overflow: hidden;
      border-radius: 0 0 8px 8px;
      font-size: 20px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      color: #111;
      background: linear-gradient(90deg, #ffaf24, #ffd66a);
      box-shadow: 0 10px 22px rgba(255, 177, 38, 0.28);
    }

    .button::after {
      content: "";
      position: absolute;
      top: -35%;
      bottom: -35%;
      left: -40%;
      width: 28%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      animation: shine 2.8s ease-in-out infinite;
    }

    .live-card.ruiying .button {
      color: #fff;
      background: linear-gradient(90deg, #096cff, #4b95ff);
      box-shadow: 0 10px 22px rgba(16, 109, 255, 0.3);
    }

    .live-card.lianke .button {
      color: #fff;
      background: linear-gradient(90deg, #7b2ff7, #a855f7);
      box-shadow: 0 10px 22px rgba(123, 47, 247, 0.3);
    }

    .live-card:active {
      transform: scale(0.99);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardFloat {
      0%,
      100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -4px;
      }
    }

    @keyframes shine {
      0% {
        left: -45%;
      }

      45%,
      100% {
        left: 120%;
      }
    }

    @media (max-width: 360px) {
      .h5-page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .header h1 {
        font-size: 27px;
      }

      .button {
        min-height: 48px;
        font-size: 18px;
      }
    }

    @media (min-width: 900px) {
      .h5-page {
        width: min(1180px, 92vw);
        padding-top: 36px;
      }

      .header {
        margin-bottom: 22px;
      }

      .topbar {
        margin-bottom: 24px;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
      }

      .brand-name {
        font-size: 24px;
      }

      .social-link {
        width: 40px;
        height: 40px;
      }

      .social-link svg {
        width: 20px;
        height: 20px;
      }

      .header h1 {
        font-size: 42px;
      }

      .header p {
        font-size: 18px;
      }

      .live-list {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        max-width: 820px;
        margin-inline: auto;
        gap: 22px;
      }

      .live-list:has(.live-card:nth-child(3)) {
        max-width: none;
      }

      .poster {
        aspect-ratio: 2.05 / 1;
      }

      .button {
        min-height: 66px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="h5-page">
    <nav class="topbar" aria-label="Ave.ai links">
      <a class="brand" href="https://pro.ave.ai/" target="_blank" rel="noopener noreferrer" aria-label="打开 Ave.ai 官网">
        <img src="./assets/logo.png" height="30" alt="Ave.ai logo">
        <span class="brand-name">Ave.ai</span>
      </a>

      <span class="socials">
        <a class="social-link" href="https://x.com/aveai_info" target="_blank" rel="noopener noreferrer" aria-label="打开 Ave.ai X">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.67l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23Zm-1.16 17.52h1.83L7.08 4.13H5.12l11.96 15.64Z"/>
          </svg>
        </a>
        <a class="social-link" href="https://t.me/ave_community_cn" target="_blank" rel="noopener noreferrer" aria-label="打开 Ave.ai Telegram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.95 3.35 18.7 20.02c-.25 1.18-.91 1.47-1.84.92l-5.08-3.75-2.45 2.36c-.27.27-.5.5-1.03.5l.37-5.18 9.43-8.52c.41-.37-.09-.58-.63-.21L5.81 13.48.8 11.91c-1.09-.34-1.11-1.09.23-1.61L20.6 2.76c.91-.34 1.7.2 1.35.59Z"/>
          </svg>
        </a>
      </span>
    </nav>

    <header class="header">
      <h1>社区直播间</h1>
      <p>每日 20:00-22:00 直播带单</p>
    </header>

    <section class="live-list" aria-label="直播间入口"></section>

    <script src="config.js"></script>
    <script>
      const list = document.querySelector('.live-list');
      window.LIVE_ROOMS.forEach(room => {
        list.insertAdjacentHTML('beforeend', `
          <a class="live-card ${room.name}" href="${room.link}" target="_blank" rel="noopener noreferrer" aria-label="进入${room.title}">
            <span class="poster">
              <img src="${room.poster}" alt="${room.title}海报">
            </span>
            <span class="action">
              <span class="button">进入${room.title}</span>
            </span>
          </a>
        `);
      });
    </script>
  </main>
</body>
</html>
